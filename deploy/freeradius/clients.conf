#  Abyssal Arsenal: NAS clients are defined in Panopticon (RADIUS page), not
#  here. Any source address is a *dynamic* client: on its first packet,
#  FreeRADIUS asks Panopticon (server abyssal_dynamic_clients, below) for the
#  matching NAS client's shared secret, and ignores the packet when there's
#  none -- the same rule as Panopticon's embedded server. A change on the
#  RADIUS page takes effect within `lifetime` seconds.

client abyssal_any_v4 {
	ipaddr = 0.0.0.0/0
	dynamic_clients = abyssal_dynamic_clients
	lifetime = 300
}

client abyssal_any_v6 {
	ipaddr = ::/0
	dynamic_clients = abyssal_dynamic_clients
	lifetime = 300
}
