name: Release

# Fires on a version tag push (git tag v0.1.0 && git push --tags), or can be
# re-run by hand against an existing tag. Independent of docker-publish.yml,
# which reacts to the same tag push to build/push the matching control-plane
# image -- both run in parallel, neither depends on the other.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Only needed when re-running by hand."
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Release only ever proceeds past a green test run -- tag pushes don't
      # otherwise trigger ci.yml (it's scoped to main and pull requests), so
      # this is the only gate a release actually has to pass.
      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace --bin abyssal-arsenal --bin abyssal-agent

      # Two artifacts, because this is a control-plane/agent split: the
      # control-plane binary is normally run via the published Docker image
      # (see docker-publish.yml) but is included here too, while
      # abyssal-agent is *only* ever distributed this way -- it runs
      # directly on each managed Linux host, never containerized.
      - name: Package binaries
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"

          server_stage="abyssal-arsenal-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "$server_stage"
          cp target/release/abyssal-arsenal "$server_stage/"
          cp README.md LICENSE .env.example "$server_stage/"
          tar -czf "${server_stage}.tar.gz" "$server_stage"

          agent_stage="abyssal-agent-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "$agent_stage"
          cp target/release/abyssal-agent "$agent_stage/"
          cp crates/agent/README.md LICENSE "$agent_stage/"
          tar -czf "${agent_stage}.tar.gz" "$agent_stage"

          {
            echo "SERVER_ASSET_PATH=${server_stage}.tar.gz"
            echo "AGENT_ASSET_PATH=${agent_stage}.tar.gz"
          } >> "$GITHUB_ENV"

      # Migrations are embedded into the control-plane binary at compile
      # time (sqlx::migrate! in crates/database/src/pool.rs), so nothing
      # else needs to ship alongside it beyond docs and a starting .env
      # template. Docker (see docker-publish.yml) is the primary supported
      # deployment path for the control plane; this is a bonus artifact for
      # running it directly. abyssal-agent, on the other hand, is always
      # run this way -- copy the binary to the managed host and go.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.SERVER_ASSET_PATH }}
            ${{ env.AGENT_ASSET_PATH }}
