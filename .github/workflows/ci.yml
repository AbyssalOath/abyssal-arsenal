name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a stale run when new commits land on the same branch/PR, so runs
# don't queue up behind each other while a branch is still being pushed to.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No database needed: everything in crates/database and crates/web uses
      # runtime sqlx::query (not the query! macro), and the existing tests
      # (core, auth, rbac, execution, hosts) are all pure unit tests.
      #
      # TLS checks: the internal CA (crates/internal-ca, cross-checked with
      # openssl); the agent's own rustls client against its certificates
      # (crates/agent/src/tls_tests.rs); and the served install.ps1 /
      # generated Windows commands through the PowerShell parser and
      # PSScriptAnalyzer (crates/web bootstrap tests). openssl and pwsh both
      # ship on ubuntu-latest, and those tests fail rather than skip under CI.
      - name: Ensure PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
      - run: cargo test --workspace

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  shellcheck:
    name: shellcheck + install.sh
    runs-on: ubuntu-latest
    # `bash -n` and `sh -n` only parse. shellcheck also catches what breaks
    # when a line actually runs -- the v0.2.2 install.sh shipped a
    # `${var:-...'...}` that only failed at the end of a real install. The
    # scripts the control plane serves (/install.sh, the generated
    # one-liners) are shellchecked by crates/web's bootstrap tests instead.
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck -S warning install.sh scripts/*.sh tests/install-sh/run.sh
      # Runs the real install.sh end to end (every reverse-proxy choice,
      # re-runs, the legacy TLS upgrade, the agent on this server) against a
      # fake docker -- what shellcheck can't see.
      - run: tests/install-sh/run.sh

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    # Validates the Dockerfile actually builds on every PR, without needing
    # registry credentials -- actual publishing happens in
    # docker-publish.yml, only on pushes to main or a version tag, never
    # from a pull request.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Base images from Google's Docker Hub mirror: shared runners hit
          # Docker Hub's anonymous rate limit (429) -- see the Dockerfile.
          build-args: BASE_REGISTRY=mirror.gcr.io/library
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-agent:
    name: windows agent + MSI
    runs-on: windows-latest
    # The only place the Windows agent and its MSI are built before a
    # release -- without this, a broken build or .wxs would first fail the
    # release job, after the tag is already pushed.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p abyssal-agent -p abyssal-agent-protocol --all-targets -- -D warnings
      - run: cargo test -p abyssal-agent -p abyssal-agent-protocol
      - run: cargo build --release -p abyssal-agent
      - name: Build MSI
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global wix --version 5.0.2
          wix build crates/agent/wix/abyssal-agent.wxs -arch x64 \
            -d Version="$(tr -d '[:space:]' < VERSION)" \
            -d AgentExe=target/release/abyssal-agent.exe \
            -o abyssal-agent-ci.msi
