name: abyssal-arsenal

services:
  mariadb:
    image: mariadb:11
    container_name: abyssal-arsenal-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-abyssal_arsenal}
      MARIADB_USER: ${MARIADB_USER:-abyssal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
    volumes:
      - abyssal_db_data:/var/lib/mysql
    # Bound to localhost only -- lets scripts/migrate.sh (sqlx-cli, run on
    # the host) and scripts/backup-db.sh reach it without exposing MariaDB
    # to the network. Container always listens on 3306 internally; only the
    # host-side port is configurable, in case 3306 is already taken by
    # another MySQL/MariaDB instance on this machine. Set DB_PORT in .env
    # to change it.
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A brand-new data volume needs a one-time full initialization that
      # can take well over a minute before MariaDB can answer any
      # healthcheck at all -- without this, Compose gives up (5 x 10s)
      # before init even finishes and never gets the chance to see it come
      # up healthy. Failed checks during this window don't count against
      # `retries`; a restart (data already initialized) starts answering in
      # a few seconds either way.
      start_period: 120s
    networks:
      - abyssal

  app:
    build: .
    container_name: abyssal-arsenal-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      # Container always listens on 8080 internally (PORT below); only the
      # host-side port is configurable, in case 8080 is already taken by
      # something else on this machine. Set HTTP_PORT in .env to change it.
      - "${HTTP_PORT:-8080}:8080"
      # mDNS listener (Panopticon, off by default) -- ordinary UDP, no
      # extra capability needed, just the published port.
      - "5353:5353/udp"
    # Panopticon's ARP listener (off by default, crates/web/src/panopticon_arp.rs)
    # needs CAP_NET_RAW to open a raw packet capture socket -- explicit
    # here even though it's already one of Docker's default capabilities,
    # so this doesn't silently stop working if that default ever changes
    # or gets stripped by other hardening. The binary itself (not this
    # container broadly) is what's actually granted the capability, via
    # `setcap` in the Dockerfile -- see that file's comment.
    cap_add:
      - NET_RAW
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-abyssal}:${MARIADB_PASSWORD:-changeme}@mariadb:3306/${MARIADB_DATABASE:-abyssal_arsenal}
      PORT: 8080
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-abyssal_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RUST_LOG: ${RUST_LOG:-info}
      STATIC_DIR: static
      # AES-256-GCM master key for Panopticon switches' stored SNMP
      # community strings (crates/core/src/crypto.rs). Optional -- only
      # needed if you add a switch. Generate with `openssl rand -base64 32`.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Reliquary native backups (crates/web/src/reliquary_backup) -- see
      # docs/reliquary-backups.md. Archives land in the abyssal_backups
      # volume below, deliberately separate from abyssal_db_data so a
      # restore that goes wrong can't also take out the backups that would
      # fix it, and so the destination is never web-served. That volume is
      # local to this Docker host: back it up (or mount it from) somewhere
      # else off-host, or a host-level failure takes the backups with it.
      RELIQUARY_BACKUP_DESTINATION_PATH: /backups
      # Optional dedicated least-privilege DB user for `mariadb-dump`
      # (SELECT, SHOW VIEW, TRIGGER, EVENT, LOCK TABLES; see
      # docs/reliquary-backups.md for the grant script). Falls back to the
      # app's own MARIADB_USER/MARIADB_PASSWORD, with a startup warning,
      # if left unset.
      RELIQUARY_BACKUP_DB_USER: ${RELIQUARY_BACKUP_DB_USER:-}
      RELIQUARY_BACKUP_DB_PASSWORD: ${RELIQUARY_BACKUP_DB_PASSWORD:-}
    volumes:
      - abyssal_backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abyssal

  caddy:
    image: caddy:2-alpine
    container_name: abyssal-arsenal-caddy
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - abyssal_caddy_data:/data
      - abyssal_caddy_config:/config
    networks:
      - abyssal

volumes:
  abyssal_db_data:
  abyssal_backups:
  abyssal_caddy_data:
  abyssal_caddy_config:

networks:
  abyssal:
