name: abyssal-arsenal

services:
  mariadb:
    image: mariadb:11
    container_name: abyssal-arsenal-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-abyssal_arsenal}
      MARIADB_USER: ${MARIADB_USER:-abyssal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
    volumes:
      - abyssal_db_data:/var/lib/mysql
    # Bound to localhost only -- lets scripts/migrate.sh (sqlx-cli, run on
    # the host) and scripts/backup-db.sh reach it without exposing MariaDB
    # to the network. Container always listens on 3306 internally; only the
    # host-side port is configurable, in case 3306 is already taken by
    # another MySQL/MariaDB instance on this machine. Set DB_PORT in .env
    # to change it.
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A brand-new data volume needs a one-time full initialization that
      # can take well over a minute before MariaDB can answer any
      # healthcheck at all -- without this, Compose gives up (5 x 10s)
      # before init even finishes and never gets the chance to see it come
      # up healthy. Failed checks during this window don't count against
      # `retries`; a restart (data already initialized) starts answering in
      # a few seconds either way.
      start_period: 120s
    networks:
      - abyssal

  app:
    build: .
    container_name: abyssal-arsenal-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      # Container always listens on 8080 internally (PORT below); only the
      # host-side port is configurable, in case 8080 is already taken by
      # something else on this machine. Set HTTP_PORT in .env to change it.
      #
      # APP_HTTP_BIND controls which host interface that port is published on.
      # Behind the bundled Caddy, install.sh sets it to 127.0.0.1 so the app is
      # NOT reachable over plain HTTP from the network -- Caddy reaches it over
      # the internal `abyssal` network instead, and all browser traffic goes
      # through Caddy's HTTPS. This matters: COOKIE_SECURE is on behind Caddy,
      # so a browser that reached the app over plain http:// would have its
      # session cookie dropped and loop the login. Direct/no-proxy installs
      # leave APP_HTTP_BIND unset, publishing on all interfaces as before.
      - "${APP_HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
      # mDNS listener (Panopticon, off by default) -- ordinary UDP, no
      # extra capability needed, just the published port.
      - "5353:5353/udp"
      # Panopticon's embedded RADIUS server (NAC phase 5, off by default):
      # auth (1812) + accounting (1813). Ordinary UDP, no extra capability.
      # Published so NAS devices (switches/APs) can reach it; harmless when
      # the server is disabled (nothing binds inside the container).
      - "1812:1812/udp"
      - "1813:1813/udp"
    # Panopticon's ARP listener (off by default, crates/web/src/panopticon_arp.rs)
    # needs CAP_NET_RAW to open a raw packet capture socket -- explicit
    # here even though it's already one of Docker's default capabilities,
    # so this doesn't silently stop working if that default ever changes
    # or gets stripped by other hardening. The binary itself (not this
    # container broadly) is what's actually granted the capability, via
    # `setcap` in the Dockerfile -- see that file's comment.
    cap_add:
      - NET_RAW
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-abyssal}:${MARIADB_PASSWORD:-changeme}@mariadb:3306/${MARIADB_DATABASE:-abyssal_arsenal}
      PORT: 8080
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-abyssal_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Base URL the control plane is reachable at, used to build the clickable
      # link in outgoing emails (currently the password-reset email). Left
      # unset, the reset email still works, just with the raw token instead of
      # a link. Set by ./install.sh from your reverse-proxy answer.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # External syslog/SIEM export (RFC 5424 over UDP). Leave SYSLOG_HOST
      # empty to disable. Whether the audit trail streams here is a separate
      # runtime toggle in /admin/settings; Thanatos findings always do once a
      # destination is set.
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-514}
      SYSLOG_APP_NAME: ${SYSLOG_APP_NAME:-abyssal-arsenal}
      # Chat / webhook alerting. Set a Slack or Teams incoming-webhook URL (or a
      # generic JSON webhook) to receive Thanatos findings in a channel. Each
      # provider's *_MIN_SEVERITY (info|warning|critical, default warning) keeps
      # the per-finding firehose off the channel -- set critical for alerts only.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_MIN_SEVERITY: ${SLACK_MIN_SEVERITY:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TEAMS_MIN_SEVERITY: ${TEAMS_MIN_SEVERITY:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_MIN_SEVERITY: ${WEBHOOK_MIN_SEVERITY:-}
      RUST_LOG: ${RUST_LOG:-info}
      STATIC_DIR: static
      # AES-256-GCM master key for Panopticon switches' stored SNMP
      # community strings (crates/core/src/crypto.rs). Optional -- only
      # needed if you add a switch. Generate with `openssl rand -base64 32`.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Reliquary native backups (crates/web/src/reliquary_backup) -- see
      # docs/reliquary-backups.md. Archives land in the abyssal_backups
      # volume below, deliberately separate from abyssal_db_data so a
      # restore that goes wrong can't also take out the backups that would
      # fix it, and so the destination is never web-served. That volume is
      # local to this Docker host: back it up (or mount it from) somewhere
      # else off-host, or a host-level failure takes the backups with it.
      RELIQUARY_BACKUP_DESTINATION_PATH: /backups
      # Optional dedicated least-privilege DB user for `mariadb-dump`
      # (SELECT, SHOW VIEW, TRIGGER, EVENT, LOCK TABLES; see
      # docs/reliquary-backups.md for the grant script). Falls back to the
      # app's own MARIADB_USER/MARIADB_PASSWORD, with a startup warning,
      # if left unset.
      RELIQUARY_BACKUP_DB_USER: ${RELIQUARY_BACKUP_DB_USER:-}
      RELIQUARY_BACKUP_DB_PASSWORD: ${RELIQUARY_BACKUP_DB_PASSWORD:-}
      # Sepulchre's `local` protocol connections (docs/sepulchre.md) may
      # only read/write inside this comma-separated allowlist of absolute
      # host paths -- never anywhere else, even if misconfigured. Left
      # unset, it defaults to just RELIQUARY_BACKUP_DESTINATION_PATH above
      # (i.e. the abyssal_backups volume) so Reliquary can be pointed at a
      # Sepulchre connection without any extra configuration; set this
      # explicitly to allow additional paths, or to an empty string to
      # disable the `local` protocol entirely.
      SEPULCHRE_LOCAL_ROOTS: ${SEPULCHRE_LOCAL_ROOTS:-}
      # Directory the control plane serves agent binaries from (GET /agent/{os}),
      # so hosts download the agent from this control plane instead of GitHub --
      # essential on internal/air-gapped networks. Populate the volume with a
      # built archive (abyssal-agent-windows.zip / abyssal-agent-linux.tar.gz),
      # or leave it empty to have the control plane fetch from GitHub on demand.
      AGENT_DIST_DIR: /agent-dist
      # Internal TLS (Caddy with no public domain): the address(es) the first
      # private CA and server certificate are created for, at first start.
      # After that the CA is managed from /admin/health/tls (renewal is
      # automatic; rotation and address changes are done there) and this only
      # matters if the abyssal_tls_* volumes are ever lost. Empty = TLS isn't
      # ours to manage (Let's Encrypt, your own proxy, plain HTTP).
      INTERNAL_TLS_ADDRESSES: ${INTERNAL_TLS_ADDRESSES:-}
      # Own reverse proxy with a certificate from your own internal CA? Point
      # this at that CA's public certificate (mount it in) and the agent
      # install commands will fetch and pin it the same way.
      PUBLIC_CA_FILE: ${PUBLIC_CA_FILE:-}
    volumes:
      - abyssal_backups:/backups
      - abyssal_agent_dist:/agent-dist
      # CA certificate + private key: mounted into this container only.
      - abyssal_tls_ca:/tls/ca
      # Server certificate + key, shared read-only with Caddy.
      - abyssal_tls_server:/tls/server
      - abyssal_caddy_admin:/run/caddy-admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abyssal

  caddy:
    image: caddy:2-alpine
    container_name: abyssal-arsenal-caddy
    restart: unless-stopped
    profiles: ["caddy"]
    # The app creates the internal certificate (when there is one) before it
    # reports healthy, so Caddy never starts without it.
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Server cert + key for the internal/IP-only install path, issued and
      # renewed by the app (the Caddyfile references /etc/caddy/certs/
      # {cert,key}.pem). Never the CA's key. Empty and unused on the Let's
      # Encrypt (public domain) path.
      - abyssal_tls_server:/etc/caddy/certs:ro
      # Caddy's admin API as a Unix socket shared only with the app, which
      # uses it to make Caddy load a renewed certificate. Never on a network.
      - abyssal_caddy_admin:/run/caddy-admin
      - abyssal_caddy_data:/data
      - abyssal_caddy_config:/config
    networks:
      - abyssal

volumes:
  abyssal_db_data:
  abyssal_backups:
  abyssal_agent_dist:
  abyssal_caddy_data:
  abyssal_caddy_config:
  abyssal_tls_ca:
  abyssal_tls_server:
  abyssal_caddy_admin:

networks:
  abyssal:
