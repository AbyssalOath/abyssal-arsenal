[package]
name = "abyssal-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "abyssal-agent"
path = "src/main.rs"

[dependencies]
abyssal-agent-protocol.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
zeroize.workspace = true
libc.workspace = true
sha2.workspace = true
rand.workspace = true
chrono.workspace = true
# Direct handles on the TLS stack reqwest and tokio-tungstenite already use
# (same versions, same ring provider), so both share one ClientConfig that
# can carry an operator-supplied CA -- see src/tls.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"

[dev-dependencies]
abyssal-internal-ca.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
winreg = "0.55"
