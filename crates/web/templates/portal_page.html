<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="15">{% endif %}
<title>{{ title }}</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #6b21a8; --border: #d2d2d7; --error: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111114; --card: #1c1c21; --text: #f2f2f5; --muted: #a1a1aa; --accent: #c084fc; --border: #3f3f46; --error: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 2rem 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
  p { margin: .5rem 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
  input[type=text], input[type=email] { width: 100%; padding: .6rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 1rem; }
  .terms { white-space: pre-wrap; max-height: 12rem; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: .75rem; font-size: .9rem; background: var(--bg); }
  .check { display: flex; gap: .5rem; align-items: flex-start; font-weight: 400; }
  button { margin-top: 1.25rem; width: 100%; padding: .75rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .error { color: var(--error); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>{{ title }}</h1>
    {% for line in message %}<p>{{ line }}</p>{% endfor %}
    {% if show_form %}
    {% if !error.is_empty() %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/register">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required maxlength="100" autocomplete="name" value="{{ name }}">
      <label for="email">Email <span class="muted">(optional)</span></label>
      <input type="email" id="email" name="email" maxlength="255" autocomplete="email" value="{{ email }}">
      {% if !terms.is_empty() %}
      <label>Terms of use</label>
      <div class="terms">{{ terms }}</div>
      {% endif %}
      <label class="check"><input type="checkbox" name="accept" value="yes" required> I accept the terms of use</label>
      <button type="submit">{% if sponsor %}Request access{% else %}Connect{% endif %}</button>
    </form>
    {% endif %}
    <p class="muted">Device {{ mac }}</p>
  </div>
</main>
</body>
</html>
