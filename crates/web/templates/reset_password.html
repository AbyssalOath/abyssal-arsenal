<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Abyssal Arsenal</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">Abyssal Arsenal</div>
      <div class="brand-subtitle">Set a new password</div>

      {% if let Some(e) = error %}
      <div class="error-banner">{{ e }}</div>
      {% endif %}

      <p style="color:var(--text-muted); margin-top:0;">
        Paste the reset code from your email below (already filled in if
        you followed a link).
      </p>
      <form method="post" action="/reset-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="token">Reset code</label>
        <input type="text" id="token" name="token" value="{{ token }}" required autocomplete="off">

        <label for="new-password">New password</label>
        <input type="password" id="new-password" name="new_password" autocomplete="new-password" required>

        <label for="new-password-confirm">Confirm new password</label>
        <input type="password" id="new-password-confirm" name="new_password_confirm" autocomplete="new-password" required>

        <button type="submit">Set new password</button>
      </form>
      <p style="margin-top:16px;"><a href="/forgot-password">Request a new link</a></p>
    </div>
  </div>
</body>
</html>
